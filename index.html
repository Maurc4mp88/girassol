<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HaxBall Pro 2D - HUD & YouTube Fix</title>
    <!-- PeerJS para Multiplayer Online P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { touch-action: none; user-select: none; margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; background: #0e0e0e; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* AVISO MODO RETRATO */
        #rotate-device-msg { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; z-index: 100; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #rotate-device-msg .icon { font-size: 50px; margin-bottom: 15px; animation: rotateAnim 2s infinite ease-in-out; }
        #rotate-device-msg p { font-size: 18px; font-weight: bold; color: #f1c40f; }

        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (orientation: portrait) { #rotate-device-msg { display: flex; } }

        /* MENU RESPONSIVO COMPACTO (EM 2 COLUNAS NO MODO DEITADO) */
        #menu { position: absolute; background: rgba(18, 18, 18, 0.96); padding: 12px 18px; border-radius: 14px; text-align: center; z-index: 50; width: 95%; max-width: 620px; max-height: 92vh; overflow-y: auto; border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        #menu h1 { color: #2ecc71; font-size: 20px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
        @media (max-width: 520px) or (orientation: portrait) { .menu-grid { grid-template-columns: 1fr; } }

        .customization-box { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; }
        .customization-box h3 { font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
        .custom-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
        .custom-row label { font-size: 11px; }
        .custom-row input[type="color"] { border: none; width: 32px; height: 22px; border-radius: 4px; cursor: pointer; background: none; }
        .custom-row input[type="text"] { width: 90px; padding: 3px; font-size: 11px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #333; color: white; }
        
        .btn-group { display: flex; flex-direction: column; justify-content: center; }
        .btn-group button { width: 100%; padding: 8px; margin: 3px 0; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; color: white; cursor: pointer; transition: 0.2s; }
        .btn-solo { background: #e67e22; }
        .btn-host { background: #27ae60; }
        .btn-join { background: #2980b9; }
        .btn-group button:active { filter: brightness(1.2); transform: scale(0.98); }
        
        #join-code { width: 100%; padding: 6px; margin: 3px 0; font-size: 13px; text-align: center; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-weight: bold; }
        
        /* MINI PLAYER DO YOUTUBE INTEGRADO NO MENU */
        #yt-preview-box { margin-top: 6px; background: #111; padding: 6px; border-radius: 6px; border: 1px solid #333; text-align: center; }
        #yt-player-frame { width: 100%; height: 80px; border-radius: 4px; border: none; margin-top: 4px; }

        /* GAME CONTAINER */
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        canvas { background: #2d5a27; border: 3px solid #fff; border-radius: 8px; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 10; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* TOUCH CONTROLS */
        #touch-zone-left { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; z-index: 10; }
        #joystick-base { display: none; position: absolute; width: 90px; height: 90px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; pointer-events: none; z-index: 15; }
        #joystick-stick { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.85); border-radius: 50%; position: absolute; top: 25px; left: 25px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        
        /* BOTÕES DE CHUTE */
        #btn-kick { position: absolute; bottom: 20px; right: 20px; width: 75px; height: 75px; border-radius: 50%; background: rgba(231, 76, 60, 0.85); color: white; font-weight: bold; font-size: 14px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; transition: transform 0.1s ease; }
        #btn-kick:active { background: #c0392b; transform: scale(0.88); }
        
        #btn-super-kick { position: absolute; bottom: 20px; right: 105px; width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #f1c40f, #e67e22); color: white; font-weight: bold; font-size: 11px; text-align: center; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; transition: transform 0.1s, filter 0.2s; }
        #btn-super-kick:active { transform: scale(0.88); }
        #btn-super-kick.cooldown { filter: grayscale(1) opacity(0.5); pointer-events: none; }

        /* POP-UP DE GOL ANIMADO */
        #goal-banner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); background: rgba(0, 0, 0, 0.9); border: 4px solid #f1c40f; padding: 20px 40px; border-radius: 20px; text-align: center; z-index: 60; box-shadow: 0 0 35px rgba(241, 196, 15, 0.8); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #goal-banner.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); animation: bannerPulse 0.8s infinite alternate; }
        #goal-banner h2 { font-size: 34px; color: #f1c40f; margin: 0; text-transform: uppercase; text-shadow: 0 0 10px #e67e22; }
        #goal-banner p { font-size: 15px; color: #fff; margin-top: 5px; font-weight: bold; }

        @keyframes bannerPulse {
            0% { box-shadow: 0 0 20px rgba(241, 196, 15, 0.6); transform: translate(-50%, -50%) scale(0.98); }
            100% { box-shadow: 0 0 45px rgba(241, 196, 15, 1); transform: translate(-50%, -50%) scale(1.02); }
        }
    </style>
</head>
<body>

<!-- AVISO MODO RETRATO -->
<div id="rotate-device-msg">
    <div class="icon">🔄📱</div>
    <p>Por favor, vire o celular deitado (Modo Paisagem) para jogar!</p>
</div>

<!-- POP-UP DE GOL ANIMADO -->
<div id="goal-banner">
    <h2>⚡ GOOOOOOL! ⚡</h2>
    <p id="goal-subtext">GOL DO TIME VERMELHO!</p>
</div>

<!-- MENU -->
<div id="menu">
    <h1>HaxBall Pro</h1>
    
    <div class="menu-grid">
        <!-- COLUNA DA ESQUERDA: CUSTOMIZAÇÃO E MÚSICA -->
        <div>
            <div class="customization-box">
                <h3>Customização</h3>
                <div class="custom-row">
                    <label>Avatar / Número:</label>
                    <input type="text" id="cust-number" value="10" maxlength="3">
                </div>
                <div class="custom-row">
                    <label>Cor da Camisa:</label>
                    <input type="color" id="cust-color" value="#e74c3c">
                </div>
                <div class="custom-row">
                    <label>Cor da Borda:</label>
                    <input type="color" id="cust-border" value="#000000">
                </div>
            </div>

            <!-- SELETOR DE MÚSICA DO YOUTUBE -->
            <div class="customization-box" style="margin-top: 6px;">
                <h3>🎵 Música de Gol (YouTube)</h3>
                
                <select id="yt-preset-select" onchange="onPresetChange()" style="width: 100%; padding: 4px; font-size: 11px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                    <option value="0Qqd6T_A9LY">🏆 Hino da Champions League</option>
                    <option value="custom">🔗 Cole Seu Link do YouTube</option>
                </select>

                <div id="yt-custom-box" style="display: none; margin-top: 4px;">
                    <input type="text" id="cust-yt-link" placeholder="Cole o Link do YouTube aqui" style="width: 100%; padding: 4px; font-size: 11px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                </div>

                <button type="button" onclick="loadAndTestMusic()" style="width: 100%; margin-top: 5px; padding: 5px; font-size: 11px; font-weight: bold; background: #e74c3c; border: none; border-radius: 4px; color: white; cursor: pointer;">▶️ Testar / Carregar Música</button>

                <!-- MINI PLAYER DO YOUTUBE INTEGRADO -->
                <div id="yt-preview-box">
                    <div id="yt-player-div"></div>
                </div>
            </div>
        </div>

        <!-- COLUNA DA DIREITA: BOTOES DE MODO DE JOGO -->
        <div class="btn-group">
            <button class="btn-solo" onclick="startSolo()">⚽ Modo Treino (Solo)</button>
            <button class="btn-host" onclick="createRoom()">Criar Sala Online</button>
            <div id="room-code-display" style="margin: 3px 0; font-size: 14px; font-weight: bold; color: #f1c40f; text-align: center;"></div>
            <input type="number" id="join-code" placeholder="Código (4 dígitos)">
            <button class="btn-join" onclick="joinRoom()">Entrar na Sala</button>
        </div>
    </div>
</div>

<!-- GAME AREA -->
<div id="game-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    
    <div id="touch-zone-left"></div>
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    
    <button id="btn-super-kick">SUPER<br><span id="super-timer">CHUTE</span></button>
    <button id="btn-kick">CHUTAR</button>
</div>

<!-- YOUTUBE IFRAME API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // PARÂMETROS FÍSICOS E TEMPO
    const DT = 1 / 60;
    const PLAYER_RADIUS = 15;
    const BALL_RADIUS = 10;
    const POST_RADIUS = 8;
    
    const ACCEL = 0.58;
    const DAMP_PLAYER = 0.88;
    const DAMP_BALL = 0.990;
    const MASS_PLAYER = 1.0;
    const MASS_BALL = 0.42;    
    const RESTITUTION_DRIBBLE = 0.35;
    const RESTITUTION_WALL = 0.95;
    const KICK_RANGE = PLAYER_RADIUS + BALL_RADIUS + 12;
    const KICK_IMPULSE = 6.2;
    const SUPER_KICK_IMPULSE = 12.5;

    // Campo & Goleiras Escavadas
    const PITCH_X1 = 60, PITCH_X2 = 740;
    const PITCH_Y1 = 40, PITCH_Y2 = 460;
    const GOAL_Y1 = 180, GOAL_Y2 = 320;
    const GOAL_DEPTH = 45;

    const posts = [
        { x: PITCH_X1, y: GOAL_Y1, r: POST_RADIUS },
        { x: PITCH_X1, y: GOAL_Y2, r: POST_RADIUS },
        { x: PITCH_X2, y: GOAL_Y1, r: POST_RADIUS },
        { x: PITCH_X2, y: GOAL_Y2, r: POST_RADIUS }
    ];

    let peer = null, conn = null;
    let isHost = false, isOnline = false;

    // --- INTEGRANDO YOUTUBE PLAYER API ---
    let ytPlayer = null;
    let currentVideoId = "0Qqd6T_A9LY"; // Hino da Champions
    let isYTReady = false;

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player-div', {
            height: '75',
            width: '100%',
            videoId: currentVideoId,
            playerVars: { 'autoplay': 0, 'controls': 1, 'playsinline': 1 },
            events: {
                'onReady': () => { isYTReady = true; }
            }
        });
    }

    function parseYouTubeID(urlOrId) {
        if (!urlOrId) return null;
        urlOrId = urlOrId.trim();
        if (urlOrId.length === 11) return urlOrId;
        
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = urlOrId.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function onPresetChange() {
        const select = document.getElementById('yt-preset-select');
        const customBox = document.getElementById('yt-custom-box');
        if (select.value === 'custom') {
            customBox.style.display = 'block';
        } else {
            customBox.style.display = 'none';
            currentVideoId = select.value;
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(currentVideoId);
                ytPlayer.pauseVideo();
            }
        }
    }

    function loadAndTestMusic() {
        const select = document.getElementById('yt-preset-select');
        let idToLoad = select.value;

        if (select.value === 'custom') {
            const inputVal = document.getElementById('cust-yt-link').value;
            const extracted = parseYouTubeID(inputVal);
            if (extracted) {
                idToLoad = extracted;
            } else {
                alert("Cole um link válido do YouTube!");
                return;
            }
        }

        currentVideoId = idToLoad;

        if (ytPlayer && ytPlayer.loadVideoById) {
            ytPlayer.loadVideoById(currentVideoId);
            ytPlayer.playVideo();
        }
    }

    function playGoalMusic() {
        if (ytPlayer && isYTReady && ytPlayer.playVideo) {
            try {
                ytPlayer.seekTo(0);
                ytPlayer.playVideo();
            } catch(e){}
        } else {
            playStadiumHorn(); // Som de apoio caso o YT falhe
        }
    }

    function stopGoalMusic() {
        if (ytPlayer && isYTReady && ytPlayer.pauseVideo) {
            try { ytPlayer.pauseVideo(); } catch(e){}
        }
    }

    // SOM DE APOIO (BUZINA NATIVA)
    let audioCtx = null;
    function playStadiumHorn() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 2.0);
        } catch(e) {}
    }

    // Estado do Jogo
    let state = {
        p1: { x: 200, y: 250, vx: 0, vy: 0, r: PLAYER_RADIUS, color: '#e74c3c', border: '#000', avatar: '10', input: {x:0, y:0, kick:false, superKick:false} },
        p2: { x: 600, y: 250, vx: 0, vy: 0, r: PLAYER_RADIUS, color: '#3498db', border: '#000', avatar: '7', input: {x:0, y:0, kick:false, superKick:false} },
        ball: { x: 400, y: 250, vx: 0, vy: 0, r: BALL_RADIUS },
        score: { p1: 0, p2: 0 },
        timeRemaining: 180,
        isGoalPause: false
    };

    let localInput = { x: 0, y: 0, kick: false, superKick: false };
    let superKickCooldown = 0;

    function requestFullscreen() {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }
    }

    function updateCustomization() {
        state.p1.avatar = document.getElementById('cust-number').value || '10';
        state.p1.color = document.getElementById('cust-color').value;
        state.p1.border = document.getElementById('cust-border').value;
    }

    function startSolo() {
        requestFullscreen();
        updateCustomization();
        document.getElementById('menu').style.display = 'none';
        isHost = true; isOnline = false;
        initPhysicsLoop();
        startMatchTimer();
    }

    function createRoom() {
        requestFullscreen();
        updateCustomization();
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer("haxpro-" + code);

        document.getElementById('room-code-display').innerText = "Código da Sala: " + code;

        peer.on('open', () => { isHost = true; isOnline = true; });
        peer.on('connection', (c) => { conn = c; setupConnection(); });
        peer.on('error', () => { createRoom(); });
    }

    function joinRoom() {
        requestFullscreen();
        updateCustomization();
        const code = document.getElementById('join-code').value.trim();
        if (!code) return alert("Digite o código da sala!");

        peer = new Peer();
        peer.on('open', () => {
            isHost = false; isOnline = true;
            conn = peer.connect("haxpro-" + code);
            setupConnection();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('menu').style.display = 'none';
            if (!isHost) {
                conn.send({ type: 'cust', avatar: state.p1.avatar, color: state.p1.color, border: state.p1.border });
            } else {
                initPhysicsLoop();
                startMatchTimer();
            }
        });

        conn.on('data', (data) => {
            if (isHost) {
                if (data.type === 'cust') {
                    state.p2.avatar = data.avatar;
                    state.p2.color = data.color;
                    state.p2.border = data.border;
                } else {
                    state.p2.input = data;
                }
            } else {
                state = data;
            }
        });
    }

    function startMatchTimer() {
        setInterval(() => {
            if (isHost && !state.isGoalPause && state.timeRemaining > 0) {
                state.timeRemaining--;
            }
        }, 1000);
    }

    function showGoalBanner(teamText) {
        playGoalMusic();
        const banner = document.getElementById('goal-banner');
        document.getElementById('goal-subtext').innerText = teamText;
        banner.classList.add('show');
        
        setTimeout(() => {
            banner.classList.remove('show');
        }, 4000);
    }

    // CONTROLES TECLADO
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; updateKeyInput(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; updateKeyInput(); });

    function updateKeyInput() {
        if (stickTouchId !== null) return;
        localInput.x = 0; localInput.y = 0;
        if (keys['arrowleft'] || keys['a']) localInput.x -= 1;
        if (keys['arrowright'] || keys['d']) localInput.x += 1;
        if (keys['arrowup'] || keys['w']) localInput.y -= 1;
        if (keys['arrowdown'] || keys['s']) localInput.y += 1;
        localInput.kick = keys[' '] || keys['x'];
        if (keys['shift'] || keys['z']) triggerSuperKick();
        sendInput();
    }

    // JOYSTICK DINÂMICO
    const touchZone = document.getElementById('touch-zone-left');
    const base = document.getElementById('joystick-base');
    const stick = document.getElementById('joystick-stick');
    let stickTouchId = null;
    let touchOrigin = { x: 0, y: 0 };

    touchZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        stickTouchId = touch.identifier;
        touchOrigin.x = touch.clientX;
        touchOrigin.y = touch.clientY;

        base.style.left = (touchOrigin.x - 45) + 'px';
        base.style.top = (touchOrigin.y - 45) + 'px';
        base.style.display = 'block';
        stick.style.transform = `translate(0px, 0px)`;
    });

    touchZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (t.identifier === stickTouchId) {
                let dx = t.clientX - touchOrigin.x;
                let dy = t.clientY - touchOrigin.y;
                const maxR = 30;
                const dist = Math.hypot(dx, dy);

                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }

                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                localInput.x = dx / maxR;
                localInput.y = dy / maxR;
                sendInput();
            }
        }
    });

    const resetJoystick = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === stickTouchId) {
                stickTouchId = null;
                base.style.display = 'none';
                localInput.x = 0; localInput.y = 0;
                sendInput();
            }
        }
    };

    touchZone.addEventListener('touchend', resetJoystick);
    touchZone.addEventListener('touchcancel', resetJoystick);

    // CHUTES
    const kickBtn = document.getElementById('btn-kick');
    kickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); localInput.kick = true; sendInput(); });
    kickBtn.addEventListener('touchend', (e) => { e.preventDefault(); localInput.kick = false; sendInput(); });

    const superBtn = document.getElementById('btn-super-kick');
    superBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerSuperKick(); });

    function triggerSuperKick() {
        if (superKickCooldown <= 0) {
            localInput.superKick = true;
            superKickCooldown = 5;
            const btn = document.getElementById('btn-super-kick');
            const timerLabel = document.getElementById('super-timer');
            btn.classList.add('cooldown');

            let cd = 5;
            timerLabel.innerText = cd + "s";

            const interval = setInterval(() => {
                cd--;
                if (cd > 0) {
                    timerLabel.innerText = cd + "s";
                } else {
                    clearInterval(interval);
                    superKickCooldown = 0;
                    btn.classList.remove('cooldown');
                    timerLabel.innerText = "CHUTE";
                }
            }, 1000);

            sendInput();
            setTimeout(() => { localInput.superKick = false; sendInput(); }, 100);
        }
    }

    function sendInput() {
        if (isHost) {
            state.p1.input = localInput;
        } else if (conn && conn.open) {
            conn.send(localInput);
        }
    }

    // FÍSICA
    function initPhysicsLoop() {
        setInterval(() => {
            if (isHost) updatePhysics();
        }, 1000 / 60);
    }

    function updatePhysics() {
        if (state.isGoalPause) return;

        const activePlayers = isOnline ? [state.p1, state.p2] : [state.p1];

        activePlayers.forEach(p => {
            p.vx += p.input.x * ACCEL;
            p.vy += p.input.y * ACCEL;
            p.vx *= DAMP_PLAYER;
            p.vy *= DAMP_PLAYER;
            p.x += p.vx;
            p.y += p.vy;

            p.x = Math.max(PITCH_X1 + p.r, Math.min(PITCH_X2 - p.r, p.x));
            p.y = Math.max(PITCH_Y1 + p.r, Math.min(PITCH_Y2 - p.r, p.y));
        });

        if (isOnline) resolveCircleCollision(state.p1, state.p2, MASS_PLAYER, MASS_PLAYER, RESTITUTION_WALL);

        activePlayers.forEach(p => {
            let dx = state.ball.x - p.x;
            let dy = state.ball.y - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= KICK_RANGE && dist > 0) {
                let nx = dx / dist;
                let ny = dy / dist;

                if (p.input.superKick) {
                    state.ball.vx = nx * SUPER_KICK_IMPULSE + p.vx * 0.4;
                    state.ball.vy = ny * SUPER_KICK_IMPULSE + p.vy * 0.4;
                    p.input.superKick = false;
                } else if (p.input.kick) {
                    state.ball.vx = nx * KICK_IMPULSE + p.vx * 0.25;
                    state.ball.vy = ny * KICK_IMPULSE + p.vy * 0.25;
                } else {
                    resolveCircleCollision(p, state.ball, MASS_PLAYER, MASS_BALL, RESTITUTION_DRIBBLE);
                }
            } else {
                resolveCircleCollision(p, state.ball, MASS_PLAYER, MASS_BALL, RESTITUTION_DRIBBLE);
            }
        });

        let b = state.ball;
        b.vx *= DAMP_BALL;
        b.vy *= DAMP_BALL;
        b.x += b.vx;
        b.y += b.vy;

        posts.forEach(post => {
            resolveCircleCollision(post, b, Infinity, MASS_BALL, RESTITUTION_WALL);
        });

        resolveBallWalls(b);

        if (isOnline && conn && conn.open) conn.send(state);
    }

    function resolveCircleCollision(c1, c2, m1, m2, est) {
        let dx = c2.x - c1.x;
        let dy = c2.y - c1.y;
        let dist = Math.hypot(dx, dy);
        let minDist = c1.r + c2.r;

        if (dist < minDist && dist > 0) {
            let nx = dx / dist;
            let ny = dy / dist;

            let overlap = minDist - dist;
            if (m1 === Infinity) {
                c2.x += nx * overlap;
                c2.y += ny * overlap;
            } else {
                let totalM = m1 + m2;
                c1.x -= nx * overlap * (m2 / totalM);
                c1.y -= ny * overlap * (m2 / totalM);
                c2.x += nx * overlap * (m1 / totalM);
                c2.y += ny * overlap * (m1 / totalM);
            }

            let kx = (c1.vx || 0) - (c2.vx || 0);
            let ky = (c1.vy || 0) - (c2.vy || 0);
            let p = 2 * (nx * kx + ny * ky) / ((m1 === Infinity ? 0 : 1/m1) + 1/m2);

            if (p > 0) {
                if (m1 !== Infinity) {
                    c1.vx -= (p / m1) * nx * est;
                    c1.vy -= (p / m1) * ny * est;
                }
                c2.vx += (p / m2) * nx * est;
                c2.vy += (p / m2) * ny * est;
            }
        }
    }

    function resolveBallWalls(b) {
        if (b.y - b.r < PITCH_Y1 && b.x >= PITCH_X1 && b.x <= PITCH_X2) { b.y = PITCH_Y1 + b.r; b.vy *= -RESTITUTION_WALL; }
        if (b.y + b.r > PITCH_Y2 && b.x >= PITCH_X1 && b.x <= PITCH_X2) { b.y = PITCH_Y2 - b.r; b.vy *= -RESTITUTION_WALL; }

        let isGoalY = b.y > GOAL_Y1 && b.y < GOAL_Y2;

        if (b.x - b.r < PITCH_X1 && !isGoalY) { b.x = PITCH_X1 + b.r; b.vx *= -RESTITUTION_WALL; }
        if (b.x + b.r > PITCH_X2 && !isGoalY) { b.x = PITCH_X2 - b.r; b.vx *= -RESTITUTION_WALL; }

        if (b.x < PITCH_X1 && isGoalY) {
            if (b.x - b.r < PITCH_X1 - GOAL_DEPTH) {
                state.score.p2++;
                triggerGoalPause("GOL DO TIME AZUL!");
            }
            if (b.y - b.r < GOAL_Y1) { b.y = GOAL_Y1 + b.r; b.vy *= -0.5; }
            if (b.y + b.r > GOAL_Y2) { b.y = GOAL_Y2 - b.r; b.vy *= -0.5; }
        }

        if (b.x > PITCH_X2 && isGoalY) {
            if (b.x + b.r > PITCH_X2 + GOAL_DEPTH) {
                state.score.p1++;
                triggerGoalPause("GOL DO TIME VERMELHO!");
            }
            if (b.y - b.r < GOAL_Y1) { b.y = GOAL_Y1 + b.r; b.vy *= -0.5; }
            if (b.y + b.r > GOAL_Y2) { b.y = GOAL_Y2 - b.r; b.vy *= -0.5; }
        }
    }

    function triggerGoalPause(text) {
        state.isGoalPause = true;
        showGoalBanner(text);
        setTimeout(() => {
            stopGoalMusic();
            resetPositions();
            state.isGoalPause = false;
        }, 4500);
    }

    function resetPositions() {
        state.ball = { x: 400, y: 250, vx: 0, vy: 0, r: BALL_RADIUS };
        state.p1.x = 200; state.p1.y = 250; state.p1.vx = 0; state.p1.vy = 0;
        state.p2.x = 600; state.p2.y = 250; state.p2.vx = 0; state.p2.vy = 0;
    }

    // RENDERIZAÇÃO
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Campo
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 3;
        ctx.strokeRect(PITCH_X1, PITCH_Y1, PITCH_X2 - PITCH_X1, PITCH_Y2 - PITCH_Y1);
        ctx.beginPath(); ctx.moveTo(400, PITCH_Y1); ctx.lineTo(400, PITCH_Y2); ctx.stroke();
        ctx.beginPath(); ctx.arc(400, 250, 65, 0, Math.PI * 2); ctx.stroke();

        // Goleiras
        drawGoalNet(PITCH_X1 - GOAL_DEPTH, GOAL_Y1, GOAL_DEPTH, GOAL_Y2 - GOAL_Y1);
        drawGoalNet(PITCH_X2, GOAL_Y1, GOAL_DEPTH, GOAL_Y2 - GOAL_Y1);

        // Traves
        posts.forEach(post => {
            ctx.beginPath();
            ctx.arc(post.x, post.y, post.r, 0, Math.PI * 2);
            ctx.fillStyle = '#f39c12';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // Jogadores
        drawPlayer(state.p1);
        if (isOnline) drawPlayer(state.p2);

        // Bola
        drawPaintedBall(state.ball);

        // Placar e Tempo
        ctx.fillStyle = 'white';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        
        let mins = Math.floor(state.timeRemaining / 60);
        let secs = state.timeRemaining % 60;
        let timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        ctx.fillText(`${state.score.p1}   [ ${timeStr} ]   ${state.score.p2}`, 400, 32);

        requestAnimationFrame(draw);
    }

    function drawGoalNet(x, y, w, h) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        for (let i = x; i <= x + w; i += 10) {
            ctx.beginPath(); ctx.moveTo(i, y); ctx.lineTo(i, y + h); ctx.stroke();
        }
        for (let j = y; j <= y + h; j += 10) {
            ctx.beginPath(); ctx.moveTo(x, j); ctx.lineTo(x + w, j); ctx.stroke();
        }
    }

    function drawPlayer(p) {
        if (p.input.superKick) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r + 9, 0, Math.PI * 2);
            ctx.strokeStyle = '#e67e22';
            ctx.lineWidth = 4;
            ctx.stroke();
        } else if (p.input.kick) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI * 2);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = p.border;
        ctx.stroke();

        ctx.fillStyle = p.border === '#ffffff' || p.border === '#fff' ? '#000' : '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.avatar, p.x, p.y);
    }

    function drawPaintedBall(b) {
        ctx.beginPath();
        ctx.arc(b.x + 2, b.y + 3, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.fill();
    }

    draw();
</script>
