<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HaxBall Pro 2D - Balanço Perfeito</title>
    <!-- PeerJS para Multiplayer Online P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { touch-action: none; user-select: none; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* MENU INTERATIVO */
        #menu { position: absolute; background: rgba(18, 18, 18, 0.95); padding: 25px; border-radius: 16px; text-align: center; z-index: 30; width: 90%; max-width: 380px; border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #menu h1 { color: #2ecc71; font-size: 26px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .customization-box { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #444; }
        .customization-box h3 { font-size: 14px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; }
        .custom-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
        .custom-row label { font-size: 14px; }
        .custom-row input[type="color"] { border: none; width: 40px; height: 30px; border-radius: 4px; cursor: pointer; background: none; }
        .custom-row input[type="text"] { width: 80px; padding: 5px; font-size: 14px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #333; color: white; font-weight: bold; }
        
        .btn-group button { width: 100%; padding: 12px; margin: 5px 0; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; transition: 0.2s; }
        .btn-solo { background: #e67e22; }
        .btn-host { background: #27ae60; }
        .btn-join { background: #2980b9; }
        .btn-group button:active { filter: brightness(1.2); transform: scale(0.98); }
        
        #join-code { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; text-align: center; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-weight: bold; }
        
        /* ÁREA DO JOGO */
        #game-container { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 850px; }
        canvas { background: #2d5a27; border: 4px solid #fff; border-radius: 10px; width: 95vw; max-width: 800px; height: auto; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        
        /* ZONA TOUCH DO JOYSTICK */
        #touch-zone-left { position: absolute; top: 0; left: 0; width: 60%; height: 100%; z-index: 10; }
        
        /* JOYSTICK DINÂMICO */
        #joystick-base { display: none; position: absolute; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; pointer-events: none; z-index: 15; }
        #joystick-stick { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.85); border-radius: 50%; position: absolute; top: 28px; left: 28px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        
        /* BOTÃO CHUTAR */
        #btn-kick { position: absolute; bottom: 20px; right: 25px; width: 85px; height: 85px; border-radius: 50%; background: #e74c3c; color: white; font-weight: bold; font-size: 16px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; }
        #btn-kick:active { background: #c0392b; transform: scale(0.95); }
    </style>
</head>
<body>

<!-- MENU DE CUSTOMIZAÇÃO E SALA -->
<div id="menu">
    <h1>HaxBall Pro</h1>
    
    <div class="customization-box">
        <h3>Customização do Jogador</h3>
        <div class="custom-row">
            <label>Número/Avatar:</label>
            <input type="text" id="cust-number" value="10" maxlength="3">
        </div>
        <div class="custom-row">
            <label>Cor da Camisa:</label>
            <input type="color" id="cust-color" value="#e74c3c">
        </div>
        <div class="custom-row">
            <label>Cor da Borda:</label>
            <input type="color" id="cust-border" value="#000000">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-solo" onclick="startSolo()">⚽ Modo Treino (Solo)</button>
        <button class="btn-host" onclick="createRoom()">Criar Sala Online</button>
        <div id="room-code-display" style="margin: 6px 0; font-size: 16px; font-weight: bold; color: #f1c40f;"></div>
        <input type="number" id="join-code" placeholder="Digite o Código (4 dígitos)">
        <button class="btn-join" onclick="joinRoom()">Entrar na Sala</button>
    </div>
</div>

<!-- CONTAINER DO CANVAS E CONTROLES -->
<div id="game-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    
    <div id="touch-zone-left"></div>
    
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>
    
    <button id="btn-kick">CHUTAR</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- PARÂMETROS FÍSICOS RECALIBRADOS ---
    const DT = 1 / 60;
    const PLAYER_RADIUS = 15;
    const BALL_RADIUS = 10;
    const POST_RADIUS = 8;
    
    // Velocidade e Chute Equilibrados
    const ACCEL = 0.58;        // Aceleração ágil e fluida
    const DAMP_PLAYER = 0.88;  // Controle firme de parada
    const DAMP_BALL = 0.990;   // Deslize realista do HaxBall
    const MASS_PLAYER = 1.0;
    const MASS_BALL = 0.42;    
    const RESTITUTION_DRIBBLE = 0.35; // Colisão suave para carregar a bola
    const RESTITUTION_WALL = 0.95;
    const KICK_RANGE = PLAYER_RADIUS + BALL_RADIUS + 12; // Alcance do chute (37px)
    const KICK_IMPULSE = 6.2;  // Força de chute realista e controlada

    // Campo & Goleiras Escavadas
    const PITCH_X1 = 60, PITCH_X2 = 740;
    const PITCH_Y1 = 40, PITCH_Y2 = 460;
    const GOAL_Y1 = 180, GOAL_Y2 = 320;
    const GOAL_DEPTH = 45;

    // Traves
    const posts = [
        { x: PITCH_X1, y: GOAL_Y1, r: POST_RADIUS },
        { x: PITCH_X1, y: GOAL_Y2, r: POST_RADIUS },
        { x: PITCH_X2, y: GOAL_Y1, r: POST_RADIUS },
        { x: PITCH_X2, y: GOAL_Y2, r: POST_RADIUS }
    ];

    let peer = null, conn = null;
    let isHost = false, isOnline = false;

    // Estado do Jogo
    let state = {
        p1: { x: 200, y: 250, vx: 0, vy: 0, r: PLAYER_RADIUS, color: '#e74c3c', border: '#000', avatar: '10', input: {x:0, y:0, kick:false} },
        p2: { x: 600, y: 250, vx: 0, vy: 0, r: PLAYER_RADIUS, color: '#3498db', border: '#000', avatar: '7', input: {x:0, y:0, kick:false} },
        ball: { x: 400, y: 250, vx: 0, vy: 0, r: BALL_RADIUS },
        score: { p1: 0, p2: 0 }
    };

    let localInput = { x: 0, y: 0, kick: false };

    function updateCustomization() {
        state.p1.avatar = document.getElementById('cust-number').value || '10';
        state.p1.color = document.getElementById('cust-color').value;
        state.p1.border = document.getElementById('cust-border').value;
    }

    function startSolo() {
        updateCustomization();
        document.getElementById('menu').style.display = 'none';
        isHost = true; isOnline = false;
        initPhysicsLoop();
    }

    function createRoom() {
        updateCustomization();
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer("haxpro-" + code);

        document.getElementById('room-code-display').innerText = "Código da Sala: " + code;

        peer.on('open', () => { isHost = true; isOnline = true; });
        peer.on('connection', (c) => { conn = c; setupConnection(); });
        peer.on('error', () => { createRoom(); });
    }

    function joinRoom() {
        updateCustomization();
        const code = document.getElementById('join-code').value.trim();
        if (!code) return alert("Digite o código da sala!");

        peer = new Peer();
        peer.on('open', () => {
            isHost = false; isOnline = true;
            conn = peer.connect("haxpro-" + code);
            setupConnection();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('menu').style.display = 'none';
            if (!isHost) {
                conn.send({ type: 'cust', avatar: state.p1.avatar, color: state.p1.color, border: state.p1.border });
            } else {
                initPhysicsLoop();
            }
        });

        conn.on('data', (data) => {
            if (isHost) {
                if (data.type === 'cust') {
                    state.p2.avatar = data.avatar;
                    state.p2.color = data.color;
                    state.p2.border = data.border;
                } else {
                    state.p2.input = data;
                }
            } else {
                state = data;
            }
        });
    }

    // --- CONTROLE POR TECLADO (PC) ---
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; updateKeyInput(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; updateKeyInput(); });

    function updateKeyInput() {
        if (stickTouchId !== null) return;
        localInput.x = 0; localInput.y = 0;
        if (keys['arrowleft'] || keys['a']) localInput.x -= 1;
        if (keys['arrowright'] || keys['d']) localInput.x += 1;
        if (keys['arrowup'] || keys['w']) localInput.y -= 1;
        if (keys['arrowdown'] || keys['s']) localInput.y += 1;
        localInput.kick = keys[' '] || keys['x'];
        sendInput();
    }

    // --- JOYSTICK DINÂMICO ---
    const touchZone = document.getElementById('touch-zone-left');
    const base = document.getElementById('joystick-base');
    const stick = document.getElementById('joystick-stick');
    let stickTouchId = null;
    let touchOrigin = { x: 0, y: 0 };

    touchZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        stickTouchId = touch.identifier;
        
        const rect = document.getElementById('game-container').getBoundingClientRect();
        touchOrigin.x = touch.clientX - rect.left;
        touchOrigin.y = touch.clientY - rect.top;

        base.style.left = (touchOrigin.x - 50) + 'px';
        base.style.top = (touchOrigin.y - 50) + 'px';
        base.style.display = 'block';
        stick.style.transform = `translate(0px, 0px)`;
    });

    touchZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (t.identifier === stickTouchId) {
                const rect = document.getElementById('game-container').getBoundingClientRect();
                const currentX = t.clientX - rect.left;
                const currentY = t.clientY - rect.top;

                let dx = currentX - touchOrigin.x;
                let dy = currentY - touchOrigin.y;
                const maxR = 35;
                const dist = Math.hypot(dx, dy);

                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }

                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                localInput.x = dx / maxR;
                localInput.y = dy / maxR;
                sendInput();
            }
        }
    });

    const resetJoystick = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === stickTouchId) {
                stickTouchId = null;
                base.style.display = 'none';
                localInput.x = 0; localInput.y = 0;
                sendInput();
            }
        }
    };

    touchZone.addEventListener('touchend', resetJoystick);
    touchZone.addEventListener('touchcancel', resetJoystick);

    // Botão de Chutar
    const kickBtn = document.getElementById('btn-kick');
    kickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); localInput.kick = true; sendInput(); });
    kickBtn.addEventListener('touchend', (e) => { e.preventDefault(); localInput.kick = false; sendInput(); });

    function sendInput() {
        if (isHost) {
            state.p1.input = localInput;
        } else if (conn && conn.open) {
            conn.send(localInput);
        }
    }

    // --- FÍSICA DO JOGO ---
    function initPhysicsLoop() {
        setInterval(() => {
            if (isHost) updatePhysics();
        }, 1000 / 60);
    }

    function updatePhysics() {
        const activePlayers = isOnline ? [state.p1, state.p2] : [state.p1];

        // 1. Movimento dos Jogadores
        activePlayers.forEach(p => {
            p.vx += p.input.x * ACCEL;
            p.vy += p.input.y * ACCEL;
            p.vx *= DAMP_PLAYER;
            p.vy *= DAMP_PLAYER;
            p.x += p.vx;
            p.y += p.vy;

            p.x = Math.max(PITCH_X1 + p.r, Math.min(PITCH_X2 - p.r, p.x));
            p.y = Math.max(PITCH_Y1 + p.r, Math.min(PITCH_Y2 - p.r, p.y));
        });

        // 2. Colisão Jogador vs Jogador
        if (isOnline) resolveCircleCollision(state.p1, state.p2, MASS_PLAYER, MASS_PLAYER, RESTITUTION_WALL);

        // 3. Colisão e Chute Calibrado
        activePlayers.forEach(p => {
            let dx = state.ball.x - p.x;
            let dy = state.ball.y - p.y;
            let dist = Math.hypot(dx, dy);

            // CHUTE DOSADO
            if (p.input.kick && dist <= KICK_RANGE && dist > 0) {
                let nx = dx / dist;
                let ny = dy / dist;
                state.ball.vx = nx * KICK_IMPULSE + p.vx * 0.25;
                state.ball.vy = ny * KICK_IMPULSE + p.vy * 0.25;
            } else {
                // Condução/Dribble Suave ao Encostar
                resolveCircleCollision(p, state.ball, MASS_PLAYER, MASS_BALL, RESTITUTION_DRIBBLE);
            }
        });

        // 4. Mover Bola
        let b = state.ball;
        b.vx *= DAMP_BALL;
        b.vy *= DAMP_BALL;
        b.x += b.vx;
        b.y += b.vy;

        // 5. Colisão Bola com Traves
        posts.forEach(post => {
            resolveCircleCollision(post, b, Infinity, MASS_BALL, RESTITUTION_WALL);
        });

        // 6. Colisão Paredes e Gols
        resolveBallWalls(b);

        if (isOnline && conn && conn.open) conn.send(state);
    }

    function resolveCircleCollision(c1, c2, m1, m2, est) {
        let dx = c2.x - c1.x;
        let dy = c2.y - c1.y;
        let dist = Math.hypot(dx, dy);
        let minDist = c1.r + c2.r;

        if (dist < minDist && dist > 0) {
            let nx = dx / dist;
            let ny = dy / dist;

            let overlap = minDist - dist;
            if (m1 === Infinity) {
                c2.x += nx * overlap;
                c2.y += ny * overlap;
            } else {
                let totalM = m1 + m2;
                c1.x -= nx * overlap * (m2 / totalM);
                c1.y -= ny * overlap * (m2 / totalM);
                c2.x += nx * overlap * (m1 / totalM);
                c2.y += ny * overlap * (m1 / totalM);
            }

            let kx = (c1.vx || 0) - (c2.vx || 0);
            let ky = (c1.vy || 0) - (c2.vy || 0);
            let p = 2 * (nx * kx + ny * ky) / ((m1 === Infinity ? 0 : 1/m1) + 1/m2);

            if (p > 0) {
                if (m1 !== Infinity) {
                    c1.vx -= (p / m1) * nx * est;
                    c1.vy -= (p / m1) * ny * est;
                }
                c2.vx += (p / m2) * nx * est;
                c2.vy += (p / m2) * ny * est;
            }
        }
    }

    function resolveBallWalls(b) {
        if (b.y - b.r < PITCH_Y1 && b.x >= PITCH_X1 && b.x <= PITCH_X2) { b.y = PITCH_Y1 + b.r; b.vy *= -RESTITUTION_WALL; }
        if (b.y + b.r > PITCH_Y2 && b.x >= PITCH_X1 && b.x <= PITCH_X2) { b.y = PITCH_Y2 - b.r; b.vy *= -RESTITUTION_WALL; }

        let isGoalY = b.y > GOAL_Y1 && b.y < GOAL_Y2;

        if (b.x - b.r < PITCH_X1 && !isGoalY) { b.x = PITCH_X1 + b.r; b.vx *= -RESTITUTION_WALL; }
        if (b.x + b.r > PITCH_X2 && !isGoalY) { b.x = PITCH_X2 - b.r; b.vx *= -RESTITUTION_WALL; }

        // Vão da Goleira Esquerda
        if (b.x < PITCH_X1 && isGoalY) {
            if (b.x - b.r < PITCH_X1 - GOAL_DEPTH) { state.score.p2++; resetPositions(); }
            if (b.y - b.r < GOAL_Y1) { b.y = GOAL_Y1 + b.r; b.vy *= -0.5; }
            if (b.y + b.r > GOAL_Y2) { b.y = GOAL_Y2 - b.r; b.vy *= -0.5; }
        }

        // Vão da Goleira Direita
        if (b.x > PITCH_X2 && isGoalY) {
            if (b.x + b.r > PITCH_X2 + GOAL_DEPTH) { state.score.p1++; resetPositions(); }
            if (b.y - b.r < GOAL_Y1) { b.y = GOAL_Y1 + b.r; b.vy *= -0.5; }
            if (b.y + b.r > GOAL_Y2) { b.y = GOAL_Y2 - b.r; b.vy *= -0.5; }
        }
    }

    function resetPositions() {
        state.ball = { x: 400, y: 250, vx: 0, vy: 0, r: BALL_RADIUS };
        state.p1.x = 200; state.p1.y = 250; state.p1.vx = 0; state.p1.vy = 0;
        state.p2.x = 600; state.p2.y = 250; state.p2.vx = 0; state.p2.vy = 0;
    }

    // --- RENDERIZAÇÃO GRÁFICA ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Campo
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 3;
        ctx.strokeRect(PITCH_X1, PITCH_Y1, PITCH_X2 - PITCH_X1, PITCH_Y2 - PITCH_Y1);
        ctx.beginPath(); ctx.moveTo(400, PITCH_Y1); ctx.lineTo(400, PITCH_Y2); ctx.stroke();
        ctx.beginPath(); ctx.arc(400, 250, 65, 0, Math.PI * 2); ctx.stroke();

        // Goleiras
        drawGoalNet(PITCH_X1 - GOAL_DEPTH, GOAL_Y1, GOAL_DEPTH, GOAL_Y2 - GOAL_Y1);
        drawGoalNet(PITCH_X2, GOAL_Y1, GOAL_DEPTH, GOAL_Y2 - GOAL_Y1);

        // Traves
        posts.forEach(post => {
            ctx.beginPath();
            ctx.arc(post.x, post.y, post.r, 0, Math.PI * 2);
            ctx.fillStyle = '#f39c12';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // Jogadores
        drawPlayer(state.p1);
        if (isOnline) drawPlayer(state.p2);

        // Bola
        drawPaintedBall(state.ball);

        // Placar
        ctx.fillStyle = 'white';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${state.score.p1}  -  ${state.score.p2}`, 400, 32);

        requestAnimationFrame(draw);
    }

    function drawGoalNet(x, y, w, h) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        for (let i = x; i <= x + w; i += 10) {
            ctx.beginPath(); ctx.moveTo(i, y); ctx.lineTo(i, y + h); ctx.stroke();
        }
        for (let j = y; j <= y + h; j += 10) {
            ctx.beginPath(); ctx.moveTo(x, j); ctx.lineTo(x + w, j); ctx.stroke();
        }
    }

    function drawPlayer(p) {
        if (p.input.kick) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI * 2);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = p.border;
        ctx.stroke();

        ctx.fillStyle = p.border === '#ffffff' || p.border === '#fff' ? '#000' : '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.avatar, p.x, p.y);
    }

    function drawPaintedBall(b) {
        ctx.beginPath();
        ctx.arc(b.x + 2, b.y + 3, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000000';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.fill();
    }

    draw();
</script>
</body>
</html>
